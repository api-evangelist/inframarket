name: Infra.Market
description: 'Infra.Market is a technology-enabled building materials platform serving India''s
  construction and real estate sectors across the entire project lifecycle. Operating as a house
  of brands, it supplies concrete, aggregates, steel, AAC blocks, plywood, tiles, sanitaryware,
  paints, plumbing, modular kitchens, hardware, electricals, appliances, and rental equipment
  through both B2B (direct corporate sales with site delivery) and B2R (retail via dealers and
  distributors across 17,000+ touchpoints). It is backed by 280+ manufacturing facilities across
  22 Indian states under brands including Shalimar Paints, RDC, IVAS, Robo, and Ultrafine, and is
  headquartered in Thane, Maharashtra. Added to the API Evangelist network as an Accel portfolio
  company; no public developer API surface has been identified to date.'
